name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test

  migration-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Lint migrations (expand-only, lock-safe)
        run: npm run lint:migrations
      - name: New migrations sort after the target branch
        if: github.event_name == 'pull_request'
        run: node scripts/check-migration-order.js origin/${{ github.base_ref }}
