# Ships the version staging runs, once QA signed it off: checks it, then starts
# the production deployment of that same version. Nobody types a commit.
#
# What staging runs comes from staging itself (/api/version), not from GitHub's
# deployment records: those store the workflow run's commit (main), not the
# commit a run deploys, so they are wrong for a release branch.
name: Cut release
run-name: "Cut release ${{ inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version QA signed off, e.g. v2026.10.14.2. Stops if staging runs anything else."
        required: true

permissions:
  contents: read
  actions: write

concurrency: { group: staging, cancel-in-progress: false }

jobs:
  ship:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Staging runs the version QA signed off, not yet released
        id: verify
        env: { GH_TOKEN: "${{ github.token }}", EXPECTED: "${{ inputs.version }}" }
        run: |
          read -r sha version < <(curl -fsS "https://${{ vars.STAGING_ALIAS }}/api/version" | jq -r '"\(.sha) \(.version)"')
          [ "$version" = "$EXPECTED" ] || { echo "::error::Staging runs $version, not $EXPECTED."; exit 1; }
          [ "$(git rev-parse "refs/tags/$version^{commit}" 2>/dev/null)" = "$sha" ] || { echo "::error::$version does not point at the commit staging runs ($sha)."; exit 1; }
          [ "$(gh release view "$version" --json isPrerelease --jq .isPrerelease)" = true ] || { echo "::error::$version is already released."; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # A version staged before a newer release shipped would silently undo it.
      - name: The version includes what production runs
        run: |
          production=$(curl -fsS "https://${{ vars.PRODUCTION_ALIAS }}/api/version" | jq -r .sha)
          scripts/includes-production.sh "${{ steps.verify.outputs.sha }}" "$production"
      - name: Start the production deployment
        env: { GH_TOKEN: "${{ github.token }}", VERSION: "${{ inputs.version }}", SHA: "${{ steps.verify.outputs.sha }}" }
        run: |
          gh workflow run deploy-production.yml --ref main -f tag="$VERSION" -f commit="${SHA::7}"
          echo "Started **Deploy production** for \`$VERSION\` (\`${SHA::7}\`)." >> "$GITHUB_STEP_SUMMARY"
