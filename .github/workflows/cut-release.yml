# Ships the release candidate staging serves (the one QA approved): tags its commit
# vYYYY.MM.DD.N, without the -rc.M, then starts the production deployment on that
# tag. Nobody types a SHA or a version.
#
# The commit comes from staging itself (/api/version), not from GitHub's
# deployment records: those store the workflow run's commit (main), not the
# commit a run deploys, so they are wrong for a release branch or pinned SHA.
name: Cut release
run-name: "Cut release from what staging serves"

on:
  workflow_dispatch:
    inputs:
      candidate:
        description: "Optional: the candidate QA signed off (v2026.10.14.1-rc.2). Stops if staging runs anything else."
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency: { group: staging, cancel-in-progress: false }

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Read the commit that staging serves
        id: verify
        run: |
          sha=$(curl -fsS "https://${{ vars.STAGING_ALIAS }}/api/version" | jq -r .sha)
          git cat-file -e "$sha^{commit}" || { echo "::error::Staging reports unknown commit $sha."; exit 1; }
          echo "Staging serves $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN cannot create a ref on a commit whose workflow files differ
      # from main, so tagging uses a token with the workflows permission.
      - name: Create the tag and start the production deployment
        env: { GH_TOKEN: "${{ secrets.RELEASE_TOKEN }}", SHA: "${{ steps.verify.outputs.sha }}", EXPECTED: "${{ inputs.candidate }}" }
        run: |
          # Ship the candidate staging runs: v2026.10.14.1-rc.2 becomes v2026.10.14.1.
          rc=$(git tag --points-at "$SHA" --list 'v*-rc.*' | sort -V | tail -1)
          [ -n "$rc" ] || { echo "::error::Staging runs $SHA, which has no release candidate tag. Run Deploy staging first."; exit 1; }
          if [ -n "$EXPECTED" ] && [ "$rc" != "$EXPECTED" ]; then echo "::error::Staging runs $rc, not $EXPECTED."; exit 1; fi
          tag="${rc%-rc.*}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then echo "::error::$tag is already released."; exit 1; fi
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          GH_TOKEN="${{ github.token }}" gh workflow run deploy-production.yml --ref main -f tag="$tag" -f commit="${SHA::7}"
          echo "Tagged \`$tag\` (from \`$rc\`) → \`$SHA\` and started **Deploy production** on it." >> "$GITHUB_STEP_SUMMARY"
