# Turns the commit that staging runs (the one QA approved) into a release tag,
# then starts the production deployment on that tag. Nobody types a SHA.
name: Cut release
run-name: "Cut release from ${{ inputs.sha || 'what staging runs' }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Leave empty to release what staging runs now. Override only to release an older staging commit."
        required: false

permissions:
  contents: write
  actions: write
  deployments: read

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Find the commit and check that it passed on staging
        id: verify
        env: { GH_TOKEN: "${{ github.token }}", INPUT: "${{ inputs.sha }}" }
        run: |
          api="repos/${{ github.repository }}/deployments?environment=staging"
          if [ -z "$INPUT" ]; then
            sha=$(gh api "$api&per_page=1" --jq '.[0].sha')
            echo "Staging runs $sha"
          else
            sha=$(git rev-parse --verify "$INPUT^{commit}")
          fi
          ok=0
          for id in $(gh api "$api&sha=$sha" --jq '.[].id'); do
            [ "$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state')" = success ] && ok=1
          done
          if [ "$ok" != 1 ]; then echo "::error::$sha never deployed to staging successfully."; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Create the tag and start the production deployment
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ steps.verify.outputs.sha }}" }
        run: |
          base="v$(date -u +%Y.%m.%d)"; tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do tag="$base.$n"; n=$((n+1)); done
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$SHA" >/dev/null
          gh workflow run deploy-production.yml --ref "$tag"
          echo "Tagged \`$tag\` → \`$SHA\` and started **Deploy production** on it." >> "$GITHUB_STEP_SUMMARY"
