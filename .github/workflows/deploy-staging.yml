# Puts one version on staging for QA. Merges to main never move it.
# Every new commit gets the next version (vYYYY.MM.DD.N), published as a GitHub
# pre-release; Cut release later ships that same version.
name: Deploy staging
run-name: "Staging ← ${{ inputs.ref }}"

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA. Default: the tip of main. Use release/<tag> for a hotfix."
        required: true
        default: main

permissions:
  contents: write

# One staging change at a time; Cut release joins this queue so it never reads staging mid-deploy.
concurrency: { group: staging, cancel-in-progress: false }

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Resolve the commit and check where it comes from
        id: sha
        env: { REF: "${{ inputs.ref }}" }
        run: |
          sha=$(git rev-parse --verify "origin/$REF^{commit}" 2>/dev/null || git rev-parse --verify "$REF^{commit}")
          if ! git branch -r --contains "$sha" | grep -qE 'origin/(main|release/)'; then
            echo "::error::$sha is not on main or a release/* branch."; exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require green CI for that commit
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ steps.sha.outputs.sha }}" }
        run: |
          failing=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name=="test" or .name=="migration-safety") | select(.conclusion!="success")] | length')
          passed=$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" \
            --jq '[.check_runs[] | select(.name=="test" or .name=="migration-safety") | select(.conclusion=="success")] | length')
          if [ "$failing" != 0 ] || [ "$passed" -lt 2 ]; then echo "::error::CI is not green for $SHA."; exit 1; fi
      - name: Choose the version
        id: version
        run: echo "tag=$(scripts/next-version.sh '${{ steps.sha.outputs.sha }}')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      sha: ${{ needs.resolve.outputs.sha }}
      alias: ${{ vars.STAGING_ALIAS }}
      version: ${{ needs.resolve.outputs.version }}
    secrets: inherit

  publish:
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Tag the version and publish it as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ needs.resolve.outputs.version }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          # The bot token tags: GITHUB_TOKEN cannot create a ref on a commit whose workflow files differ from main.
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" >/dev/null
            git fetch -q origin "refs/tags/$TAG:refs/tags/$TAG"
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            released=$(gh release view --json tagName --jq .tagName 2>/dev/null || true)
            notes=$(scripts/release-notes.sh "$TAG" "$released")
            # QA re-tests only what changed since the version they last saw.
            previous=$(scripts/previous-version.sh "$TAG")
            if [ -n "$previous" ] && [ "$previous" != "$released" ]; then
              notes="**Changed since $previous:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$TAG"$'\n\n'"$notes"
            fi
            gh release create "$TAG" --verify-tag --prerelease --title "$TAG" --notes "$notes"
          fi
          if [ "$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)" = true ]; then
            echo "Staging runs \`$TAG\` (\`${SHA::7}\`). After QA signs it off, **Cut release** ships this same version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Staging runs \`$TAG\` (\`${SHA::7}\`), already released." >> "$GITHUB_STEP_SUMMARY"
          fi
