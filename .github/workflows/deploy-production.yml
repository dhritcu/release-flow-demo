# Deploys a release tag to production. The pipeline always comes from main, so
# pipeline fixes apply to every release, and the code always comes from the tag.
# The production environment only accepts runs from main and needs a reviewer.
#
# Rollback = run this again with an older tag. Expand-only migrations keep the
# newer schema compatible, and the migration step accepts a database that is ahead.
name: Deploy production
run-name: "Production ← ${{ inputs.tag }}${{ inputs.commit && format(' ({0})', inputs.commit) || '' }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version (v…). Cut release fills this in; by hand, only an older release (rollback)."
        required: true
      commit:
        description: "Short commit the version must point at, shown to the approver (on the Releases page)."
        required: false
        default: ""

permissions:
  contents: write
  deployments: write

concurrency: { group: production, cancel-in-progress: false }

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: The input must be an existing v* tag
        id: tag
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", COMMIT: "${{ inputs.commit }}", ACTOR: "${{ github.triggering_actor }}" }
        run: |
          [[ "$TAG" == v* && "$TAG" != *-* ]] || { echo "::error::$TAG is not a version."; exit 1; }
          sha=$(gh api "repos/${{ github.repository }}/commits/refs/tags/$TAG" --jq .sha)
          [[ -z "$COMMIT" || "$sha" == "$COMMIT"* ]] || { echo "::error::$TAG points at $sha, not $COMMIT."; exit 1; }
          # Only a version that went through staging ships. A new version (still a
          # pre-release) ships only through Cut release, which checks QA's sign-off;
          # people start this workflow by hand only to redeploy a release (rollback).
          prerelease=$(gh release view "$TAG" --repo "${{ github.repository }}" --json isPrerelease --jq .isPrerelease 2>/dev/null) \
            || { echo "::error::$TAG never went through staging. Ship through Deploy staging and Cut release."; exit 1; }
          if [ "$prerelease" = true ] && [ "$ACTOR" != "github-actions[bot]" ]; then
            echo "::error::$TAG is not released yet. Ship it with Cut release, which checks QA's sign-off."; exit 1
          fi
          echo "Deploying \`$TAG\` (\`$sha\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ inputs.tag }}
    secrets: inherit

  release:
    needs: [resolve, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Mark the version as released and give it its release branch
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ inputs.tag }}
          SHA: ${{ needs.resolve.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$REPO" --json isPrerelease --jq .isPrerelease)" != true ]; then
            echo "Redeployed the release \`$TAG\` (rollback or retry); its notes stay as they are." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || true)
          notes=$(GITHUB_REPOSITORY="$REPO" scripts/release-notes.sh "$TAG" "$previous")
          gh release edit "$TAG" --repo "$REPO" --prerelease=false --latest --notes "$notes"
          # Every release gets release/<version>, so an urgent fix always has a branch to land on.
          # The bot token creates it: GITHUB_TOKEN cannot create refs whose workflow files differ from main.
          GH_TOKEN="$RELEASE_TOKEN" gh api "repos/$REPO/git/refs" -f ref="refs/heads/release/$TAG" -f sha="$SHA" >/dev/null 2>&1 \
            || echo "release/$TAG already exists."
          echo "Released \`$TAG\` and created \`release/$TAG\`." >> "$GITHUB_STEP_SUMMARY"
