# Deploys a release tag to production. The pipeline always comes from main, so
# pipeline fixes apply to every release, and the code always comes from the tag.
# The production environment only accepts runs from main and needs a reviewer.
#
# Rollback = run this again with an older tag. Expand-only migrations keep the
# newer schema compatible, and the migration step accepts a database that is ahead.
name: Deploy production
run-name: "Production ← ${{ inputs.tag }}${{ inputs.commit && format(' ({0})', inputs.commit) || '' }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v*). Cut release fills this in; an older tag rolls back."
        required: true
      commit:
        description: "Short SHA the tag must point at. Cut release fills it in so the approver sees it."
        required: false
        default: ""

permissions:
  contents: write
  deployments: write

concurrency: { group: production, cancel-in-progress: false }

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: The input must be an existing v* tag
        id: tag
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", COMMIT: "${{ inputs.commit }}" }
        run: |
          [[ "$TAG" == v* && "$TAG" != *-* ]] || { echo "::error::$TAG is not a release tag (release candidates ship through Cut release)."; exit 1; }
          sha=$(gh api "repos/${{ github.repository }}/commits/refs/tags/$TAG" --jq .sha)
          [[ -z "$COMMIT" || "$sha" == "$COMMIT"* ]] || { echo "::error::$TAG points at $sha, not $COMMIT."; exit 1; }
          # Only a version that went through staging ships: an existing release (rollback,
          # retry) or a release candidate on the same commit (Cut release).
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            candidates=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/$TAG-rc." --jq '.[].object.sha')
            grep -qx "$sha" <<<"$candidates" || { echo "::error::$TAG has no release candidate on $sha. Ship through Deploy staging and Cut release."; exit 1; }
          fi
          echo "Deploying \`$TAG\` (\`$sha\`)." >> "$GITHUB_STEP_SUMMARY"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      sha: ${{ needs.resolve.outputs.sha }}
      version: ${{ inputs.tag }}
    secrets: inherit

  release-notes:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Publish release notes since the previous release
        env: { GH_TOKEN: "${{ github.token }}", TAG: "${{ inputs.tag }}", REPO: "${{ github.repository }}" }
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Redeployed the existing release \`$TAG\` (rollback or retry); its notes stay as they are." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          previous=$(gh release view --repo "$REPO" --json tagName --jq .tagName 2>/dev/null || true)
          gh release create "$TAG" --repo "$REPO" --verify-tag --latest --title "$TAG" \
            --notes "$(GITHUB_REPOSITORY="$REPO" scripts/release-notes.sh "$TAG" "$previous")"
