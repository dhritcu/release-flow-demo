# Ships a commit that already passed on staging. The production environment
# requires a reviewer, then this workflow tags the commit and writes release notes.
name: Release to production
run-name: "Production ← ${{ inputs.sha }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA that passed QA on staging"
        required: true

permissions:
  contents: write
  deployments: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: The commit must have a successful staging deployment
        id: check
        env: { GH_TOKEN: "${{ github.token }}", INPUT: "${{ inputs.sha }}" }
        run: |
          sha=$(gh api "repos/${{ github.repository }}/commits/$INPUT" --jq .sha)
          ok=0
          for id in $(gh api "repos/${{ github.repository }}/deployments?environment=staging&sha=$sha" --jq '.[].id'); do
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state')
            [ "$state" = success ] && ok=1
          done
          if [ "$ok" != 1 ]; then echo "::error::$sha was never deployed to staging successfully."; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: verify
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: production
      sha: ${{ needs.verify.outputs.sha }}
    secrets: inherit

  tag:
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag the release and publish notes
        env: { GH_TOKEN: "${{ github.token }}", SHA: "${{ needs.verify.outputs.sha }}" }
        run: |
          base="prod-$(date -u +%Y-%m-%d)"; tag="$base"; n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do tag="$base.$n"; n=$((n+1)); done
          previous=$(git tag --list 'prod-*' --sort=-creatordate | head -1)
          args=(--target "$SHA" --title "$tag" --generate-notes)
          [ -n "$previous" ] && args+=(--notes-start-tag "$previous")
          gh release create "$tag" "${args[@]}"
          echo "Released \`$tag\` → \`$SHA\` (previous: \`${previous:-none}\`)" >> "$GITHUB_STEP_SUMMARY"
